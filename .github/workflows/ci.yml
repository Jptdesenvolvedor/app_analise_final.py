name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda: confere se os links de fontes.json ainda respondem

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Links de fontes (só no agendamento semanal)
        if: github.event_name == 'schedule'
        run: pytest -m network -q
